[project]
name = "chat-db-app-observer"
version = "0.1.0"
description = "Chat DB App subject implementation for the AI-powered operator"
requires-python = ">=3.11"
dependencies = [
    "operator-protocols",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_db_app_observer"]
