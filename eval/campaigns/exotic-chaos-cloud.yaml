name: exotic-chaos-cloud
subjects: [tikv]

# All 5 new exotic failure modes
chaos_types:
  - type: process_pause
  - type: packet_loss
    params: {percent: 30}
  - type: asymmetric_partition
  - type: pd_leader_kill
  - type: leader_concentration

trials_per_combination: 3
parallel: 1
cooldown_seconds: 10
include_baseline: true
variant: default

cloud:
  provider: gcp
  operator:
    enabled: true
    image: us-central1-docker.pkg.dev/operator-486214/eval/operator:latest
