name: tikv-diagnostic-difficulty
subjects: [tikv]

# Failures that are diagnostically ambiguous -- symptoms are noisy or misleading
chaos_types:
  - type: process_pause
  - type: packet_loss
    params: {percent: 30}
  - type: asymmetric_partition

trials_per_combination: 3
parallel: 1
cooldown_seconds: 10
include_baseline: false
