name: tikv-all-chaos-cloud
subjects: [tikv]

# All implemented chaos types including cloud-only ones
chaos_types:
  # Sudden node failure (SIGKILL)
  - type: node_kill

  # Network latency injection (tc netem) - moderate
  - type: latency
    params:
      min_ms: 50
      max_ms: 150

  # Network latency - higher severity
  - type: latency
    params:
      min_ms: 200
      max_ms: 500

  # Network partition (iptables blocking TiKV <-> peers and TiKV <-> PD)
  - type: network_partition

  # Freeze process (SIGSTOP) - container stays running but process halted
  - type: process_pause

  # Intermittent packet loss (tc netem)
  - type: packet_loss
    params:
      percent: 30

  # One-directional network partition to a single peer
  - type: asymmetric_partition

  # Kill a PD control plane node
  - type: pd_leader_kill

  # Move all region leaders onto one store
  - type: leader_concentration

  # disk_pressure: removed — no invariant detects filesystem-level pressure
  # (monitor checks tikv_store_size_bytes, not filesystem usage)

  # memory_exhaustion, cpu_starvation: not yet implemented in chaos.py

trials_per_combination: 3
parallel: 1
cooldown_seconds: 10
include_baseline: true

cloud:
  provider: gcp
  operator:
    enabled: true
    image: us-central1-docker.pkg.dev/operator-486214/eval/operator:latest
