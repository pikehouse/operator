name: chatdb-db-sharding-cloud
subjects: [chat-db-app-shard]

# Multi-instance database sharding challenge (cloud variant)
# App is pre-optimized (indexes, bounded pool, fixed queries).
# 2M messages on memory-constrained PG (256MB, 30 max_connections).
# The only viable fix is horizontal sharding across multiple PG instances.
chaos_types:
  - type: db_sharding
    resolution_timeout: 900   # 15 minutes — sharding is complex

trials_per_combination: 2
parallel: 1
cooldown_seconds: 60
include_baseline: false

cloud:
  provider: gcp
  operator:
    enabled: true
