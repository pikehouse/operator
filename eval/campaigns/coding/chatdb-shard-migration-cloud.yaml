name: chatdb-shard-migration
subjects: [chat-db-app-shard]

# Standalone online_migration phase: ILIKE sequential scans across shards.
# Agent must add tsvector/GIN indexes online without downtime.
# Requires sharding + fanout + blob_storage already implemented.
continuous: true

chaos_types:
  - type: db_sharding_direct
    resolution_timeout: 900
  - type: shard_fanout
    resolution_timeout: 1800
  - type: blob_storage
    resolution_timeout: 2400
  - type: online_migration
    resolution_timeout: 1800

trials_per_combination: 1
parallel: 1
cooldown_seconds: 30
include_baseline: false

cloud:
  provider: gcp
  operator:
    enabled: true
