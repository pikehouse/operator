name: chatdb-cloud-continuous-evolution
subjects: [chat-db-app]
continuous: true
chaos_types:
  - type: missing_index
  - type: pool_exhaustion
  - type: streaming_txn
  - type: fulltext_search
  - type: read_scale
  - type: unbounded_results
  - type: write_contention
  - type: write_amplification
  - type: correlated_subquery
  - type: notification_fanout
  - type: notification_counter
  - type: notification_realtime
  - type: notification_poll_idle
  - type: notification_mark_read
  - type: notification_n_plus_one
  - type: notification_payload
  - type: notification_cleanup
  - type: notification_serialize
trials_per_combination: 1
parallel: 1
cooldown_seconds: 15

cloud:
  provider: gcp
  project: null
  zone: us-central1-a
  machine_type: e2-standard-2
  operator:
    enabled: true
