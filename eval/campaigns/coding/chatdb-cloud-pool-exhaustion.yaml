name: chatdb-cloud-pool-exhaustion
subjects: [chat-db-app]

# Targets: unbounded connection pool
# 40 concurrent users overwhelm PostgreSQL max_connections
chaos_types:
  - type: pool_exhaustion

trials_per_combination: 1
parallel: 1
cooldown_seconds: 10
include_baseline: false

cloud:
  provider: gcp
  project: null
  zone: us-central1-a
  machine_type: e2-standard-2
  operator:
    enabled: true
