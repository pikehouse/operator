name: chatdb-notification-poll-idle
subjects: [chat-db-app]

# Targets: Poll endpoint holds transaction open for 30 seconds
# 15 concurrent pollers → 15 idle-in-transaction sessions blocking autovacuum
chaos_types:
  - type: notification_poll_idle

trials_per_combination: 3
parallel: 1
cooldown_seconds: 10
include_baseline: true
