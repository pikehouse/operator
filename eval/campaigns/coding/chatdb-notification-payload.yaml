name: chatdb-notification-payload
subjects: [chat-db-app]

# Targets: SELECT * with large 50KB JSONB payloads + pagination walks all rows
# 50K notifications × 50KB = 2.5GB total, TOAST decompression dominates
chaos_types:
  - type: notification_payload

trials_per_combination: 3
parallel: 1
cooldown_seconds: 10
include_baseline: true
