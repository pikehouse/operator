name: chatdb-shard-blob
subjects: [chat-db-app-shard]

# Standalone blob_storage phase: BYTEA attachments overwhelm sharded PG.
# Agent must move blobs to GCS object storage.
# Requires sharding + fanout already implemented (use in continuous chain or after manual setup).
continuous: true

chaos_types:
  - type: db_sharding_direct
    resolution_timeout: 900
  - type: shard_fanout
    resolution_timeout: 1800
  - type: blob_storage
    resolution_timeout: 2400

trials_per_combination: 1
parallel: 1
cooldown_seconds: 30
include_baseline: false

cloud:
  provider: gcp
  operator:
    enabled: true
