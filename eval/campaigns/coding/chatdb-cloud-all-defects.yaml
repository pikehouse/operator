name: chatdb-cloud-all-defects
subjects: [chat-db-app]

# Runs all 4 per-defect chaos types
chaos_types:
  - type: missing_index
  - type: pool_exhaustion
  - type: streaming_txn
  - type: counter_race

trials_per_combination: 3
parallel: 1
cooldown_seconds: 10
include_baseline: false

cloud:
  provider: gcp
  project: null
  zone: us-central1-a
  machine_type: e2-standard-2
  operator:
    enabled: true
