name: chatdb-shard-migration-smoke
subjects: [chat-db-app-shard]

# Debug smoke test for online_migration phase.
# Short timeout — just enough to verify ticket + agent starts work.
continuous: true

chaos_types:
  - type: db_sharding_direct
    resolution_timeout: 900
  - type: shard_fanout
    resolution_timeout: 1800
  - type: blob_storage
    resolution_timeout: 2400
  - type: online_migration
    resolution_timeout: 300

trials_per_combination: 1
parallel: 1
cooldown_seconds: 10
include_baseline: false

cloud:
  provider: gcp
  operator:
    enabled: true
