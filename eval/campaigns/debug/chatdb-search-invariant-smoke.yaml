name: chatdb-search-invariant-smoke
subjects: [chat-db-app-shard]

# Smoke test for search latency invariant.
# 4-phase continuous with short timeouts to validate:
# - Phase 4 (online_migration) fires high_search_latency invariant
# - Invariant stays fired while ILIKE search is slow
# - Ticket does NOT auto-resolve before agent fixes search
continuous: true

chaos_types:
  - type: db_sharding_direct
    resolution_timeout: 900
  - type: shard_fanout
    resolution_timeout: 1800
  - type: blob_storage
    resolution_timeout: 300    # 5 min — just need to pass
  - type: online_migration
    resolution_timeout: 300    # 5 min — expect timeout (agent can't fix in 5 min)

trials_per_combination: 1
parallel: 1
cooldown_seconds: 30
include_baseline: false

cloud:
  provider: gcp
  operator:
    enabled: true
